[project]
name = "autoclip"
version = "0.1.0"
description = "Détecte les moments forts sur Twitch/Kick, monte des clips verticaux et les publie."
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "anthropic>=0.70",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "websockets>=13",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
# Lourd (CTranslate2) : à installer sur la machine qui transcrit.
transcribe = ["faster-whisper>=1.1"]
review = ["python-telegram-bot>=21"]
publish = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2"]
# Application de bureau AutoClip.exe (scripts/build_exe.py).
gui = ["customtkinter>=5.2", "pyinstaller>=6.11", "pillow>=10"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
autoclip = "autoclip.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoclip"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
